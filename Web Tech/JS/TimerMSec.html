<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <section>
        <nav class="navbar bg-dark text-white fst-italic ps-2">
            <h2>Stop watch</h2>
        </nav>
    </section>
    <section clas="mt-5">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6 m-auto">
                    <div class="card mt-5">
                        <div class="card-body text-center">
                            <h3>Stop watch</h3>
                            <span id="min">00</span>
                            <span id="sec">00</span>
                            <span id="msec">00</span>
                        </div>
                        <div class="card-body text-center">
                            <button class="btn btn-success" onclick="startTimer()" id="start">Start</button>
                            <button class="btn btn-danger" onclick="stopTimer()" id="stop">Stop</button>
                            <button class="btn btn-primary" onclick="resetTimer()" id="stop">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        
    </script>

</body>

</html>

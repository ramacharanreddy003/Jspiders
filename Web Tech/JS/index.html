<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <!-- Updated Bootstrap CSS to valid version 5.3.3 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .container-fluid {
            padding-top: 150px;
        }
    </style>
</head> 

<body class="bg-info-subtle">

    <nav class="navbar navbar-dark bg-dark">
        <div>
            <h1 class="text-success"><i class="bi bi-hourglass me-1 ms-1"></i>Counter App</h1>
        </div>
    </nav>

    <section class="container-fluid">
        <div class="row">
            <div class="col-12 col-md-4 m-auto">
                <div class="card">
                    <div class="card-body text-center">
                        <h2>Count Value</h2>
                        <h3 id="count-ele"></h3>
                        <button class="btn btn-danger" onclick="decCount()">Dec</button>
                        <button class="btn btn-success" onclick="incCount()">Inc</button>
                        <button class="btn btn-light" onclick="reset()">Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let count = document.getElementById("count-ele");
        let c = 0;
        count.textContent = c;

        function incCount() {
            c = c + 1;
            count.textContent = c;
        }

        function decCount() {
            c = c - 1;
            count.textContent = c;
        }

        function reset() {
            c = 0;
            count.textContent = c;
        }
    </script>
</body>

</html>

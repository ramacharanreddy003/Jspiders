<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="bg-success">
        <h2 class="ms-2 fst-italic">To Do List</h2>
    </div>

    <section class="container-fluid mt-3 text-center bg-success col-6 rounded">
        <div class="row">
            <h2>To Do List</h2>
        </div>
    </section>
    <div class="card card-body  text-center col-6 container-fluid">
        <form id="task-form">
            <div>
                <input type="text" placeholder="Enter your task" class="form-control text-center" id="task-input">
            </div>
            <div class="mt-2">
                <input type="submit" class="btn btn-warning" value="Add">
                <input type="submit" class="btn btn-warning" value="Update">
            </div>
        </form>
    </div>

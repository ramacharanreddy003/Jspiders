<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function fetchData() {
            let p1 = window.fetch("https://jsonplaceholder.typicode.com/users");
            let p2 = p1.then((response) => {
                console.log(response);
                return response.json();

            });
            p2.then((data) => {
                console.log(data);
                for (let user of data) {
                    console.log(user);
                }
            });
            p2.catch(err => {
                console.log(err);
            })
        }
        fetchData();

    </script>
</body>

</html>

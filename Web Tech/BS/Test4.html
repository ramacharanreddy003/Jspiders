<body>

                        <input type="password" class="form-control" placeholder="Enter password">
                       
                        <span class="input-group-text" id="basic-addon1"> <i class="bi bi-eye-slash mt-1"></i></span>
                    </div>
                    <div class="text-center">

                    </div>
                </form>
            </div>
        </div>
    </div>

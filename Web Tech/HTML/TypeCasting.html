<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCasting</title>
</head>

<body>

    <script>
        function main() {
            let a = 1;
            console.log(a++);//1
            a = ++a * 2;
            console.log(++a);
            a = a++;
            console.log(a--);
            console.log(a);

            console.log(typeof "10");
            
            console.log(typeof true);

            
            console.log(Number(typeof "Js"));//NaN

            console.log(Number(typeof "10"));
            
            console.log(Number(typeof null));
        }
        main();
    </script>























</body>

</html>

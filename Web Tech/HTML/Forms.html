<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
        <label for="state">State : </label>
        <select name="state" id="state">
            <option value="" disabled selected>--select an option--</option>
            <option value="ap">Andhra Pradesh</option>
            <option value="tn">Telangana</option>
            <option value="kerala">Kerala</option>
            <option value="Tn">Tamilnadu</option>
            <option value="up">UttarPradesh</option>
        </select> <br><br>

        <label for="Food Items">Food Items</label>
        <select name="food items" id="food items">
            <optgroup label="veg items">
                 <option value="" disabled  selected>--select an option--</option>
                 <option value="palak paneer">Palak Paneer</option>
                 <option value="mushroom biriyani">Mushroom Biryani</option>
                 <option value="gobi manchuria">Gobi Manchuria</option>
                 <option value="egg noodles">Egg Noodles</option>
            </optgroup>
            <optgroup label="non veg">
                <option value="chicken biryani">Chicken Biryani</option>
                <option value="mb">Mutton Biryani</option>
                <option value="mub">Mushroom Biryani</option>
                <option value="Fish">Fish Fry</option>
                <option value="Chicken">Chicken Curry</option>
            </option>
            <input type="reset">
            <input type="submit">
        </select> <br><br>
</body>
</html>

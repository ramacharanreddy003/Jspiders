<html lang="en">
<head>
   
    <title>Document</title>
    <script>
        console.log("We love Js");

        function main(){
            console.log("main fn is executing");
        }
        main(); //function call

        class A{
            static main(){
                console.log("main method in class A");
            }
        }
        A.main();       //method call


        function Car(){
            console.log("Car is moving");
        }
        Car();

        class Book
        {
            static BName(){
                console.log("Java");
            }
        }
        Book.BName();

        









    </script>


</head>

</body>
</html>

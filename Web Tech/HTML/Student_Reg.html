<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./CSS/css_Pract.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset>
        <legend>
            <h1 style="color: black;">Student Application</h1>
        </legend>

        <form action="">
            <label for="rollno">Roll no.</label>
            <input type="text" autofocus name="rollno" placeholder="Enter your roll number" size="50"><br><br>
            <label for="fname">First name : </label>
            <input type="text" name="fname" placeholder="Enter your first name" size="50"> -
            <label for="lname">Last name</label>
            <input type="text" name="lname" placeholder="Enter your last name" size="50"><br><br>
            <label for="fname">Father's name :</label>
            <input type="text" name="fname" placeholder="Enter your father's name" size="50"><br><br>
            <label for="DOB">Date of birth :</label>
            <input type="date" name="DOB"><br><br>
            <label for="mobileno">Mobile no. :</label>
            <input type="tel" name="mobileno" pattern="[0-9]{10}"><br><br>
            <label for="Email">Email Id :</label>
            <input type="email" name="Email" size="30"><br><br>
            <label for="password">Password :</label>
            <input type="password" name="password"><br><br>
            <label for="gender">Gender :</label>
            <input type="radio" name="gender" value="Male">Male
            <input type="radio" name="gender" value="Female">Female
            <br><br>
            <label for="dept">Department :</label>
            <input type="checkbox" name="dept" value="CSE">
            <label for="CSE">CSE</label>
            <input type="checkbox" name="dept" value="ECE">
            <label for="ECE">ECE</label>
            <input type="checkbox" name="dept" value="Mech">
            <label for="Mech">Mech</label>
            <input type="checkbox" name="dept" value="Civil">
            <label for="Civil">Civil</label>
            <br><br>

            <label for="course">Course :</label>
            <select name="course" id="course">
                <option value="" disabled selected>--Select an option--</option>
                <option value="JavaFullStack">Java Full Stack</option>
                <option value="PythonFullStack">Python Full Stack</option>
                <option value="MERN Full Stack">MERN Full Stack</option>
                <option value="MEAN Full Stack">MEAN Full Stack</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="Aptitude&Reasoning">Aptitude & Reasoning</option>
            </select>
            <br><br>

            <label for="photo">Upload photo</label>
            <input type="file" accept="image/*"><br><br>
            <label for="city">City:</label>
            <textarea name="" id="" cols="25" rows="3"></textarea><br><br>
            <label for="Address">Address:</label>
            <textarea name="" id="" cols="25" rows="3"></textarea><br><br>
            


            <input type="reset">
            <input type="submit">
        </form>
    </fieldset>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./CSS/form_Practice.css">
</head>

<body>

    <fieldset>
        <legend>
            <h1>Application Form</h1>
        </legend>
        <form action="">
            <label for="name">Name</label>
            <input type="text" name="name" autofocus><br><br>

            <label for="feedback">Feedback</label>
            <textarea name="feedback" id="" readonly disabled></textarea><br><br>

            <input type="file" accept="audio/*, video/*,.pdf/*" multiple><br><br>

            <label for="email">Email</label>
            <input type="email" name="email"><br><br>

            <label for="gender">Gender</label><br><br>
            <input type="radio" name="Gender" value="Male">
            <label for="gender">Male</label>
            <input type="radio" name="gender" value="Female">
            <label for="gender">Female</label><br><br>

            <label for="mobile">Mobile</label>
            <input type="tel" name="mobile" pattern="[0-9]{10}">




            <br><br>
            <input type="submit">
            <center>
            <p>&copy;All rights are Reserved</p></center>
        </form>
    </fieldset>
</body>

</html>
